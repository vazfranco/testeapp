services:
  api:
    build: ../backend
    ports: ["8000:8000"]
    environment:
      SECRET_KEY: change-this-in-production
      DATABASE_URL: postgresql+psycopg://emprego:emprego@db:5432/emprego
      CORS_ORIGINS: "*"
    depends_on: [db]
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: emprego
      POSTGRES_USER: emprego
      POSTGRES_PASSWORD: emprego
    volumes: [pgdata:/var/lib/postgresql/data]
volumes:
  pgdata:
